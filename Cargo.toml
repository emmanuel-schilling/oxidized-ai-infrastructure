[workspace]
resolver = "2"
members = [
    "reinforcement_learning",
    "reinforcement_learning_py",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# The Python extension oxidized_rl: release settings, but a panic unwinds so
# PyO3 can raise it as a Python exception instead of aborting the interpreter.
[profile.release-python]
inherits = "release"
panic = "unwind"

