name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build and Test Workspace
    runs-on: ubuntu-latest
    # A normal run takes a few minutes. The Rust tests share an embedded Python
    # interpreter across threads, so a deadlock would hang rather than fail;
    # this turns a hang into a failure instead of GitHub's six-hour default.
    timeout-minutes: 15

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 1. High-efficiency Rust compiler cache
    - name: Set up Rust Cache
      uses: Swatinem/rust-cache@v2

    # 2. Python 3.11 interpreter for uv and for PyO3 to link against
    - name: Install Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3. Build .venv from uv.lock, exactly as on a developer machine; this
    #    also compiles the Rust agents into the oxidized_rl module with maturin
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        version: "0.13.6"
        enable-cache: true

    - name: Install Python Dependencies
      run: uv sync --locked
      env:
        UV_PYTHON_DOWNLOADS: never

    # 4. Python format, lint, type checks and tests
    - name: Check Python
      run: |
        uv run ruff format --check .
        uv run ruff check .
        uv run pyright
        uv run pytest -q

    # 5. Execute test suites across your entire workspace
    - name: Run Workspace Tests
      run: cargo test --workspace --verbose
      env:
        PYO3_PYTHON: ${{ github.workspace }}/.venv/bin/python
